<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorClient - Biblioteca</title>
    <base href="/" />
    <!-- Bootstrap 5 y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="BlazorClient.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center vh-100 flex-column">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3 fs-5 text-muted">Cargando aplicación...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger fixed-bottom m-3 d-none">
        Se produjo un error no controlado.
        <a href="" class="reload btn btn-sm btn-outline-danger ms-2">Recargar</a>
        <a class="dismiss btn-close float-end"></a>
    </div>

    <!-- Script estándar de WebAssembly sin huellas digitales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
