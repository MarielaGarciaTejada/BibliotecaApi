name: Build and deploy Blazor Client to Azure Web App

on:
  push:
    branches:
      - 'main'
    paths:
      - 'BlazorClient/**'
      - '.github/workflows/deploy-blazor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor Client
        run: dotnet publish BlazorClient/BlazorClient.csproj -c Release -o "${{env.DOTNET_ROOT}}/myblazorapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: blazor-app
          path: ${{env.DOTNET_ROOT}}/myblazorapp/wwwroot

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: blazor-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'blazor-biblioteca-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BLAZOR }}
          package: .